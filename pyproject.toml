[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-session-viewer"
version = "0.1.0"
description = "Web-based viewer for AI coding agent session logs (Codex, Claude Code)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "baba20o" }
]
keywords = ["codex", "claude", "ai", "session", "logs", "viewer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.24.0",
]

[project.scripts]
agent-session-viewer = "agent_session_viewer.server:main"

[project.urls]
Homepage = "https://github.com/baba20o/agent-session-viewer"
Repository = "https://github.com/baba20o/agent-session-viewer"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_session_viewer"]
